name: Backend CI/CD (ECR)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "429965675866"
  ECR_REPOSITORY: futurex-app
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build Docker image (test build)
        run: |
          docker build -t futurex-app:test .

      - name: Validate Docker Compose stack
        run: |
          docker compose config --services
          docker compose --profile local-qdrant config --services

      - name: Run container (smoke test)
        run: |
          if [ -z "${{ secrets.POSTGRES_URL }}" ]; then
            echo "POSTGRES_URL secret is not set; skipping smoke test container run."
            exit 0
          fi

          docker run -d -p 7860:7860 --name test-container \
            -e POSTGRES_URL='${{ secrets.POSTGRES_URL }}' \
            -e OPENAI_API_KEY='${{ secrets.OPENAI_API_KEY }}' \
            -e QDRANT_BACKEND=none \
            futurex-app:test
          sleep 10
          docker ps -a
          docker logs test-container
          curl -f http://127.0.0.1:7860/

      - name: Stop test container
        run: |
          docker stop test-container || true
          docker rm test-container || true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
        run: |
          set -euo pipefail
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY"

          docker build \
            -t "$IMAGE_URI:$IMAGE_TAG" \
            -t "$IMAGE_URI:latest" \
            .

          docker push "$IMAGE_URI:$IMAGE_TAG"
          docker push "$IMAGE_URI:latest"

          echo "Pushed $IMAGE_URI:$IMAGE_TAG"
          echo "Pushed $IMAGE_URI:latest"

      - name: Refresh app Auto Scaling Group
        env:
          APP_ASG_NAME: ${{ vars.APP_ASG_NAME }}
        run: |
          set -euo pipefail

          if [ -z "${APP_ASG_NAME:-}" ]; then
            echo "APP_ASG_NAME repository variable is not set; image push complete, ASG refresh skipped."
            exit 0
          fi

          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$APP_ASG_NAME" \
            --preferences MinHealthyPercentage=50,InstanceWarmup=300
